[package]
name = "refactor"
version = "0.1.0"
edition = "2024"

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
rustfix = "0.6"
tracing = "0.1.41"
itertools = "0.14.0"
smallvec = { version = "1.15.1", features = ["union", "const_generics"] }
anyhow = "1.0.98"
utils = { path = "../utils" }
analyses = { path = "../analyses" }
once_cell = "1.20.2"
syn = { version = "2.0", features = ["full", "printing"] }
proc-macro2 = "1.0"
clap = { version = "4.5.42", features = ["derive"] }
regex = "1.11.1"
