[package]
name = "rewrite"
version = "0.1.0"
edition = "2024"

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
tracing = "0.1.41"
itertools = "0.14.0"
utils = { path = "../utils" }
analyses = { path = "../analyses" }
once_cell = "1.20.2"
proc-macro2 = "1.0"
clap = { version = "4.5.42", features = ["derive"] }
etrace = { version = "1.1.1" }
regex = "1.12.2"
